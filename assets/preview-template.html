<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}} · 公众号预览</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#f2f4f5;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;}
  .preview-head{background:#ffffff;border-bottom:1px solid #dfe4e8;}
  .preview-head-inner{max-width:733px;margin:0 auto;padding:16px 22px 14px;}
  .preview-label{margin:0 0 6px;font-size:12px;line-height:1.5;color:#68737d;}
  .preview-title{margin:0;font-size:18px;line-height:1.55;font-weight:700;color:#17212b;word-break:break-word;}
  .preview-actions{display:flex;gap:8px;margin-top:12px;}
  .preview-btn{appearance:none;border:1px solid #ccd4da;border-radius:6px;background:#ffffff;color:#25313c;padding:9px 14px;font-size:14px;font-weight:650;cursor:pointer;}
  .preview-btn-primary{border-color:#087ea8;background:#087ea8;color:#ffffff;}
  .preview-btn:hover{filter:brightness(.97);}
  .preview-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#17212b;color:#ffffff;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:88vw;text-align:center;}
  .preview-toast.show{opacity:1;}
  .preview-stage{max-width:733px;margin:20px auto 56px;padding:0 8px;overflow:hidden;}
  #gzh-content{width:calc(100% - 56px);margin:0 28px;}
  @media(max-width:520px){.preview-head-inner{padding:14px 16px 13px;}.preview-title{font-size:16px;}.preview-actions{display:grid;grid-template-columns:1fr 1fr;}.preview-btn{width:100%;}.preview-stage{margin-top:14px;}}
</style>
</head>
<body>
<header class="preview-head">
  <section class="preview-head-inner">
    <p class="preview-label">公众号标题</p>
    <h1 class="preview-title" id="articleTitle">{{ARTICLE_TITLE}}</h1>
    <section class="preview-actions">
      <button class="preview-btn" type="button" onclick="copyTitle()">复制标题</button>
      <button class="preview-btn preview-btn-primary" type="button" onclick="copyBody()">复制正文</button>
    </section>
  </section>
</header>
<p class="preview-toast" id="previewToast"></p>
<main class="preview-stage">
  <section id="gzh-content">
<!--GZH_CONTENT-->
  </section>
</main>
<script>
  function showToast(message){
    var toast=document.getElementById('previewToast');
    toast.textContent=message;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer=setTimeout(function(){toast.classList.remove('show');},2200);
  }
  function fallbackCopyText(text){
    var area=document.createElement('textarea');
    area.value=text;
    area.style.position='fixed';
    area.style.opacity='0';
    document.body.appendChild(area);
    area.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(error){ok=false;}
    document.body.removeChild(area);
    return ok;
  }
  function copyTitle(){
    var title=document.getElementById('articleTitle').textContent.trim();
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(title).then(function(){showToast('标题已复制');},function(){showToast(fallbackCopyText(title)?'标题已复制':'复制失败，请手动选择标题');});
    }else{
      showToast(fallbackCopyText(title)?'标题已复制':'复制失败，请手动选择标题');
    }
  }
  function copyBody(){
    var content=document.getElementById('gzh-content');
    var range=document.createRange();
    range.selectNodeContents(content);
    var selection=window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    var ok=false;
    try{ok=document.execCommand('copy');}catch(error){ok=false;}
    selection.removeAllRanges();
    showToast(ok?'正文已复制，可粘贴到公众号':'复制失败，请手动选择正文');
  }
</script>
</body>
</html>
